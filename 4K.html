<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Математика 4 клас — Марія</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #fce4ec 0%, #e3f2fd 50%, #f3e5f5 100%);
    background-size: 200% 200%;
    animation: bgShift 14s ease infinite;
    min-height: 100vh; margin: 0; padding: 14px;
    display: flex; justify-content: center; align-items: flex-start;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .app {
    background: rgba(255,255,255,.96);
    border-radius: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,.15);
    padding: 16px 18px 22px;
    max-width: 720px; width: 100%;
  }

  /* ТОП-БАР */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .brand { font-size: 16px; font-weight: bold; color: #d81b60; }
  .wallet { display: flex; gap: 8px; align-items: center; }
  .coin, .star {
    background: #fff8e1; border: 2px solid #ffe082; border-radius: 20px;
    padding: 4px 12px; font-size: 15px; font-weight: bold; color: #ef6c00;
    transition: transform .2s;
  }
  .coin.bump, .star.bump { animation: bump .5s; }
  @keyframes bump {
    0%,100% { transform: scale(1); }
    40% { transform: scale(1.35) rotate(-6deg); }
  }
  .icons { display: flex; gap: 6px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; border: none;
    background: #eceff1; font-size: 18px; cursor: pointer;
    transition: transform .15s, background .2s;
  }
  .icon-btn:hover { background: #e0e0e0; }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn.active { background: #d81b60; color: white; }

  /* ПИТОМЕЦ */
  .pet-row {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg,#fff3e0,#ffe0b2);
    border-radius: 18px; padding: 8px 12px; margin-bottom: 12px;
  }
  .pet {
    font-size: 40px; transition: transform .3s;
    display: inline-block; animation: float 2.8s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .pet.happy { animation: happyJump .7s ease; }
  @keyframes happyJump {
    0% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-16px) scale(1.2); }
    60% { transform: translateY(0) scale(.95); }
    100% { transform: translateY(0) scale(1); }
  }
  .pet.sad { animation: sadShake .6s ease; }
  @keyframes sadShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px) rotate(-6deg); }
    75% { transform: translateX(6px) rotate(6deg); }
  }
  .pet-info { flex: 1; }
  .pet-name { font-weight: bold; color: #e65100; font-size: 14px; }
  .pet-bar {
    height: 10px; background: rgba(255,255,255,.7);
    border-radius: 8px; overflow: hidden; margin-top: 4px;
  }
  .pet-bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg,#ffb74d,#ef6c00);
    border-radius: 8px; transition: width .6s ease;
  }

  /* ЭКРАНЫ */
  .screen { display: none; animation: slideIn .35s ease; }
  .screen.active { display: block; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ГЛАВНОЕ МЕНЮ — 2 больших раздела */
  .main-sections {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px;
  }
  @media (max-width: 480px) { .main-sections { grid-template-columns: 1fr; } }
  .section-card {
    border: none; border-radius: 20px; padding: 22px 16px;
    color: white; cursor: pointer; text-align: center;
    font-weight: bold; box-shadow: 0 8px 22px rgba(0,0,0,.18);
    transition: transform .15s, box-shadow .2s; position: relative; overflow: hidden;
  }
  .section-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.25); }
  .section-card:active { transform: scale(.97); }
  .section-card .emoji { display: block; font-size: 44px; margin-bottom: 8px; }
  .section-card .title { font-size: 19px; margin-bottom: 4px; }
  .section-card .sub { font-size: 12px; opacity: .9; font-weight: normal; }
  .s1 { background: linear-gradient(135deg,#ec407a,#ab47bc); }
  .s2 { background: linear-gradient(135deg,#42a5f5,#1e88e5); }

  .menu-title {
    font-size: 13px; color: #888; text-transform: uppercase;
    letter-spacing: 1px; margin: 14px 0 8px; text-align: center;
  }

  /* Сетка мини-игр */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
  .game-card {
    border: none; border-radius: 18px; padding: 14px 10px;
    font-size: 15px; font-weight: bold; color: #fff; cursor: pointer;
    text-align: center; line-height: 1.25; box-shadow: 0 6px 16px rgba(0,0,0,.18);
    transition: transform .15s, box-shadow .2s;
  }
  .game-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,.25); }
  .game-card:active { transform: scale(.96); }
  .game-card .emoji { display: block; font-size: 26px; margin-bottom: 4px; }
  .g1 { background: linear-gradient(135deg,#ec407a,#ab47bc); }
  .g2 { background: linear-gradient(135deg,#42a5f5,#1e88e5); }
  .g3 { background: linear-gradient(135deg,#66bb6a,#2e7d32); }
  .g4 { background: linear-gradient(135deg,#ffa726,#ef6c00); }
  .g5 { background: linear-gradient(135deg,#26c6da,#00838f); }
  .g6 { background: linear-gradient(135deg,#8d6e63,#4e342e); }
  .g7 { background: linear-gradient(135deg,#5c6bc0,#283593); }
  .g8 { background: linear-gradient(135deg,#ef5350,#c62828); }

  /* ЭКРАН "ПО 3" */
  .groups { display: flex; flex-direction: column; gap: 12px; }
  .group {
    border-radius: 18px; padding: 12px 14px 14px;
    animation: groupIn .5s ease backwards;
  }
  .group:nth-child(1) { animation-delay: .05s; }
  .group:nth-child(2) { animation-delay: .12s; }
  .group:nth-child(3) { animation-delay: .19s; }
  .group:nth-child(4) { animation-delay: .26s; }
  @keyframes groupIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .group-add { background: linear-gradient(135deg,#e3f2fd,#bbdefb); }
  .group-sub { background: linear-gradient(135deg,#fff3e0,#ffe0b2); }
  .group-mul { background: linear-gradient(135deg,#e8f5e9,#c8e6c9); }
  .group-div { background: linear-gradient(135deg,#f3e5f5,#e1bee7); }
  .group-title {
    font-size: 14px; font-weight: bold; color: #555;
    margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
  }
  .group-title .badge {
    background: white; color: #d81b60; width: 26px; height: 26px;
    border-radius: 50%; display: inline-flex; align-items: center;
    justify-content: center; font-size: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12);
  }
  .row {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-bottom: 8px;
  }
  .row:last-child { margin-bottom: 0; }
  .example {
    font-size: 20px; font-weight: bold; color: #333;
    white-space: nowrap; min-width: 140px; text-align: right;
  }
  .row input {
    width: 76px; font-size: 19px; text-align: center; padding: 7px 4px;
    border: 3px solid #90caf9; border-radius: 12px; outline: none;
    transition: all .2s; background: white;
  }
  .row input:focus {
    border-color: #d81b60; transform: scale(1.06);
    box-shadow: 0 0 0 4px rgba(216,27,96,.12);
  }
  .row input.ok { border-color: #2e7d32; background: #e8f5e9; animation: okPop .5s ease; }
  @keyframes okPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.25) rotate(-4deg); }
    70% { transform: scale(1.1) rotate(3deg); }
    100% { transform: scale(1); }
  }
  .row input.err { border-color: #c62828; background: #ffebee; animation: shake .45s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }
  .mark { font-size: 18px; min-width: 22px; text-align: left; opacity: 0; transform: scale(.3); }
  .mark.show { opacity: 1; transform: scale(1); animation: markIn .5s cubic-bezier(.2,.8,.3,1.6); }
  @keyframes markIn {
    0% { transform: scale(0) rotate(-90deg); }
    100% { transform: scale(1) rotate(0); }
  }

  /* ИГРОВОЙ ЭКРАН */
  .screen-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px; gap: 8px;
  }
  .screen-title { font-size: 17px; font-weight: bold; color: #333; text-align: right; }
  .back {
    background: #eceff1; border: none; border-radius: 12px;
    padding: 8px 14px; font-size: 14px; font-weight: bold;
    cursor: pointer; color: #555; transition: background .2s;
  }
  .back:hover { background: #cfd8dc; }

  .progress {
    height: 12px; background: #eee; border-radius: 8px;
    overflow: hidden; margin-bottom: 14px;
  }
  .progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg,#66bb6a,#43a047);
    border-radius: 8px; transition: width .4s ease;
  }
  .task-box {
    background: #f5f5f5; border-radius: 18px; padding: 22px 14px;
    text-align: center; font-size: 30px; font-weight: bold; color: #333;
    margin-bottom: 14px; min-height: 100px;
    display: flex; align-items: center; justify-content: center; line-height: 1.3;
    animation: taskIn .4s ease;
  }
  @keyframes taskIn {
    from { opacity: 0; transform: scale(.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .opt-btn {
    padding: 16px 8px; font-size: 20px; font-weight: bold;
    border: 3px solid #90caf9; background: white; border-radius: 16px;
    cursor: pointer; transition: all .15s; color: #333;
  }
  .opt-btn:hover { border-color: #d81b60; transform: translateY(-2px); }
  .opt-btn:active { transform: scale(.95); }
  .opt-btn.correct { border-color: #2e7d32; background: #e8f5e9; animation: optPop .5s; }
  .opt-btn.wrong { border-color: #c62828; background: #ffebee; animation: shake .45s; }
  @keyframes optPop {
    0%,100% { transform: scale(1); }
    40% { transform: scale(1.1); }
  }

  .input-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
  .input-row input {
    width: 150px; font-size: 24px; text-align: center; padding: 12px;
    border: 3px solid #90caf9; border-radius: 14px; outline: none;
  }
  .input-row input:focus { border-color: #d81b60; }
  .btn-main {
    padding: 12px 24px; font-size: 16px; font-weight: bold; border: none;
    border-radius: 14px; cursor: pointer; background: #d81b60; color: white;
    box-shadow: 0 4px 12px rgba(216,27,96,.4); transition: transform .15s;
  }
  .btn-main:active { transform: scale(.94); }
  .btn-main:hover { background: #ad1457; }
  .btn-alt { background: #90caf9; color: #0d47a1; box-shadow: 0 4px 12px rgba(144,202,249,.5); }
  .btn-alt:hover { background: #64b5f6; }

  .buttons {
    margin-top: 18px; display: flex; gap: 12px;
    justify-content: center; flex-wrap: wrap;
  }
  button.main {
    font-size: 17px; padding: 13px 30px; border: none; border-radius: 14px;
    cursor: pointer; font-weight: bold; transition: transform .15s, box-shadow .15s;
  }
  button.main:active { transform: scale(.94); }
  .check {
    background: #d81b60; color: white;
    box-shadow: 0 6px 16px rgba(216,27,96,.4);
    animation: pulse 2.2s infinite;
  }
  .check:hover { background: #ad1457; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 6px 16px rgba(216,27,96,.4); }
    50% { box-shadow: 0 6px 26px rgba(216,27,96,.75); }
  }
  .next {
    background: #90caf9; color: #0d47a1;
    box-shadow: 0 6px 16px rgba(144,202,249,.5);
  }
  .next:hover { background: #64b5f6; }

  .feedback {
    text-align: center; font-size: 16px; font-weight: bold;
    min-height: 26px; margin-top: 6px;
  }
  .feedback.ok { color: #2e7d32; }
  .feedback.err { color: #c62828; }

  .find-err-row { display: flex; gap: 10px; justify-content: center; margin: 16px 0; }
  .find-err-row button {
    padding: 14px 22px; font-size: 16px; border-radius: 14px;
    border: none; font-weight: bold; cursor: pointer;
  }
  .btn-yes { background: #66bb6a; color: white; }
  .btn-no { background: #ef5350; color: white; }

  /* МАГАЗИН */
  .shop-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px; background: #f5f5f5; border-radius: 14px; margin-bottom: 10px;
  }
  .shop-item .name { font-weight: bold; font-size: 15px; }
  .shop-item .price { color: #ef6c00; font-weight: bold; margin-left: 6px; }
  .shop-item button {
    padding: 8px 14px; border-radius: 10px; border: none;
    background: #d81b60; color: white; font-weight: bold; cursor: pointer;
  }
  .shop-item button:disabled { background: #bdbdbd; cursor: not-allowed; }

  /* РЕЗУЛЬТАТ */
  .result-screen { text-align: center; padding: 20px 10px; }
  .result-screen .big { font-size: 60px; margin-bottom: 10px; animation: happyJump .8s ease; }
  .result-screen .score { font-size: 22px; font-weight: bold; color: #d81b60; margin-bottom: 8px; }
  .result-screen .msg { color: #555; margin-bottom: 18px; }

  /* КОНФЕТТИ / ПРАЗДНИК */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 999; }
  .confetti span { position: absolute; font-size: 22px; animation: fall linear forwards; }
  @keyframes fall {
    0% { transform: translateY(-40px) rotate(0); opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }
  .celebrate {
    position: fixed; top: 45%; left: 50%;
    transform: translate(-50%,-50%) scale(0);
    font-size: 90px; z-index: 1000; pointer-events: none;
    animation: celebrateAnim 1.1s ease forwards;
  }
  @keyframes celebrateAnim {
    0% { transform: translate(-50%,-50%) scale(0) rotate(-30deg); opacity: 0; }
    50% { transform: translate(-50%,-50%) scale(1.3) rotate(10deg); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1) rotate(0); opacity: 0; }
  }
  .coinfloat {
    position: fixed; font-size: 22px; pointer-events: none; z-index: 1001;
    animation: coinFly 1s ease forwards;
  }
  @keyframes coinFly {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(0,-80px) scale(1.6); opacity: 0; }
  }
  .hint-text { color: #888; font-size: 13px; text-align: center; margin-top: 6px; }
  .center { text-align: center; }
</style>
</head>
<body>
<div class="app">

  <!-- ТОП-БАР -->
  <div class="topbar">
    <div class="brand">🌟 Математика 4 клас</div>
    <div class="wallet">
      <div class="coin" id="coinEl">🪙 0</div>
      <div class="star" id="starEl">⭐ 0</div>
    </div>
    <div class="icons">
      <button class="icon-btn" id="soundBtn" title="Звук">🔊</button>
      <button class="icon-btn" id="shopBtn" title="Магазин">🛒</button>
    </div>
  </div>

  <!-- ПИТОМЕЦ -->
  <div class="pet-row">
    <div class="pet" id="petEl">🐱</div>
    <div class="pet-info">
      <div class="pet-name" id="petName">Мурчик · Ур. 1</div>
      <div class="pet-bar"><div class="pet-bar-fill" id="petBar"></div></div>
    </div>
  </div>

  <!-- ============ ГЛАВНОЕ МЕНЮ ============ -->
  <div id="menuScreen" class="screen active">
    <div class="main-sections">
      <button class="section-card s1" data-open="threeScreen">
        <span class="emoji">📝</span>
        <div class="title">По 3 примера</div>
        <div class="sub">4 действия · 12 примеров на экране</div>
      </button>
      <button class="section-card s2" data-open="courseScreen">
        <span class="emoji">🎓</span>
        <div class="title">Полный курс</div>
        <div class="sub">8 мини-игр · НУШ 1 семестр</div>
      </button>
    </div>
    <div class="hint-text">Правильный ответ = 🪙 +1 и опыт питомцу</div>
  </div>

  <!-- ============ РАЗДЕЛ "ПО 3 ПРИМЕРА" ============ -->
  <div id="threeScreen" class="screen">
    <div class="screen-head">
      <button class="back" data-open="menuScreen">← Назад</button>
      <div class="screen-title">📝 По 3 примера</div>
    </div>
    <div class="groups" id="groups"></div>
    <div class="buttons">
      <button class="main check" id="checkBtn">Проверить</button>
      <button class="main next" id="nextBtn">Новые примеры →</button>
    </div>
    <div class="feedback" id="threeFeedback"></div>
  </div>

  <!-- ============ РАЗДЕЛ "ПОЛНЫЙ КУРС" ============ -->
  <div id="courseScreen" class="screen">
    <div class="screen-head">
      <button class="back" data-open="menuScreen">← Назад</button>
      <div class="screen-title">🎓 Полный курс</div>
    </div>
    <div class="menu-title">Выбери игру</div>
    <div class="grid">
      <button class="game-card g1" data-game="examples"><span class="emoji">✏️</span>Тренажёр<br>примеров</button>
      <button class="game-card g2" data-game="quick"><span class="emoji">⚡</span>Быстрый<br>счёт</button>
      <button class="game-card g3" data-game="table"><span class="emoji">🔢</span>Таблица<br>умножения</button>
      <button class="game-card g4" data-game="finderr"><span class="emoji">🔍</span>Найди<br>ошибку</button>
      <button class="game-card g5" data-game="order"><span class="emoji">🧩</span>Порядок<br>действий</button>
      <button class="game-card g6" data-game="compare"><span class="emoji">⚖️</span>Сравни<br>числа</button>
      <button class="game-card g7" data-game="round"><span class="emoji">🎯</span>Округли<br>числа</button>
      <button class="game-card g8" data-game="word"><span class="emoji">📖</span>Задачи</button>
    </div>
  </div>

  <!-- ============ ИГРОВОЙ ЭКРАН ============ -->
  <div id="gameScreen" class="screen">
    <div class="screen-head">
      <button class="back" data-open="courseScreen">← Назад</button>
      <div class="screen-title" id="gameTitle">Игра</div>
    </div>
    <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div id="gameBody"></div>
  </div>

  <!-- ============ МАГАЗИН ============ -->
  <div id="shopScreen" class="screen">
    <div class="screen-head">
      <button class="back" data-open="menuScreen">← Назад</button>
      <div class="screen-title">🛒 Магазин наград</div>
    </div>
    <div id="shopBody"></div>
  </div>

</div>

<div class="confetti" id="confetti"></div>

<script>
/* ================= СОХРАНЕНИЕ ================= */
const SAVE_KEY = 'maria_math_4_v2';
const defaultState = { coins: 0, stars: 0, petLevel: 1, petExp: 0, soundOn: true, purchased: [] };
let state = loadState();
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    return s ? Object.assign({}, defaultState, s) : { ...defaultState };
  } catch { return { ...defaultState }; }
}
function saveState() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }

/* ================= УТИЛИТЫ ================= */
const $ = id => document.getElementById(id);
const rnd = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const shuffle = arr => arr.slice().sort(() => Math.random() - .5);

/* ================= ЗВУКИ ================= */
let audioCtx = null;
function beep(freq, dur, type = 'sine', vol = .12) {
  if (!state.soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch {}
}
const soundCorrect = () => { beep(660, .12); setTimeout(() => beep(880, .18), 90); };
const soundWrong = () => beep(200, .22, 'sawtooth', .1);
const soundClick = () => beep(500, .05, 'square', .06);

/* ================= ПИТОМЕЦ ================= */
const PETS = ['🐱','🐶','🦊','🐼','🐨','🦁','🐯','🐸','🦄','🐲'];
const PET_NAMES = ['Мурчик','Шарик','Рыжик','Панда','Коала','Лео','Тигра','Квак','Единорог','Дракоша'];
function updatePet() {
  const idx = Math.min(state.petLevel - 1, PETS.length - 1);
  $('petEl').textContent = PETS[idx];
  $('petName').textContent = `${PET_NAMES[idx]} · Ур. ${state.petLevel}`;
  const need = state.petLevel * 5;
  $('petBar').style.width = Math.min(100, (state.petExp / need) * 100) + '%';
}
function petHappy() {
  $('petEl').classList.remove('happy');
  void $('petEl').offsetWidth;
  $('petEl').classList.add('happy');
  setTimeout(() => $('petEl').classList.remove('happy'), 800);
}
function petSad() {
  $('petEl').classList.remove('sad');
  void $('petEl').offsetWidth;
  $('petEl').classList.add('sad');
  setTimeout(() => $('petEl').classList.remove('sad'), 700);
}
function addReward(coins = 1, exp = 1) {
  state.coins += coins;
  state.petExp += exp;
  const need = state.petLevel * 5;
  if (state.petExp >= need && state.petLevel < 10) {
    state.petLevel++;
    state.petExp -= need;
    state.stars++;
    $('starEl').classList.add('bump');
    setTimeout(() => $('starEl').classList.remove('bump'), 500);
  }
  $('coinEl').classList.add('bump');
  setTimeout(() => $('coinEl').classList.remove('bump'), 500);
  updateHUD();
  petHappy();
  saveState();
}
function updateHUD() {
  $('coinEl').textContent = '🪙 ' + state.coins;
  $('starEl').textContent = '⭐ ' + state.stars;
  updatePet();
}

/* ================= РАЗДЕЛ "ПО 3 ПРИМЕРА" ================= */
const OPS = {
  '+': { title: 'Сложение', icon: '+', cls: 'group-add' },
  '−': { title: 'Вычитание', icon: '−', cls: 'group-sub' },
  '×': { title: 'Умножение', icon: '×', cls: 'group-mul' },
  '÷': { title: 'Деление', icon: '÷', cls: 'group-div' }
};

function makeExample(op) {
  let a, b, ans, text;
  if (op === '+') {
    a = rnd(120, 780); b = rnd(20, 199); ans = a + b;
    text = `${a} + ${b} =`;
  } else if (op === '−') {
    a = rnd(250, 990); b = rnd(30, a - 60); ans = a - b;
    text = `${a} − ${b} =`;
  } else if (op === '×') {
    if (Math.random() < .5) { a = rnd(2, 10); b = rnd(2, 10); }
    else { a = rnd(11, 99); b = rnd(2, 6); }
    ans = a * b; text = `${a} × ${b} =`;
  } else {
    if (Math.random() < .5) { b = rnd(2, 10); ans = rnd(2, 10); }
    else { b = rnd(2, 6); ans = rnd(11, 99); }
    a = b * ans; text = `${a} ÷ ${b} =`;
  }
  return { ans, text };
}

function buildThreeGroups() {
  const groupsEl = $('groups');
  groupsEl.innerHTML = '';
  $('threeFeedback').textContent = '';
  ['+','−','×','÷'].forEach(op => {
    const info = OPS[op];
    const g = document.createElement('div');
    g.className = 'group ' + info.cls;
    const title = document.createElement('div');
    title.className = 'group-title';
    title.innerHTML = `<span class="badge">${info.icon}</span> ${info.title} — 3 примера`;
    g.appendChild(title);
    for (let i = 0; i < 3; i++) {
      const ex = makeExample(op);
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.answer = ex.ans;
      row.dataset.state = 'pending';
      const txt = document.createElement('span');
      txt.className = 'example'; txt.textContent = ex.text;
      const inp = document.createElement('input');
      inp.type = 'number'; inp.inputMode = 'numeric'; inp.placeholder = '?';
      const mark = document.createElement('span');
      mark.className = 'mark';
      row.append(txt, inp, mark);
      g.appendChild(row);
    }
    groupsEl.appendChild(g);
  });
}

function checkThree() {
  const rows = $('groups').querySelectorAll('.row');
  let newlyCorrect = 0, newlyWrong = 0;
  let allDone = true;
  rows.forEach(row => {
    if (row.dataset.state === 'ok') return;
    const inp = row.querySelector('input');
    const mark = row.querySelector('.mark');
    if (row.dataset.state === 'err-shown') { allDone = false; return; }
    const v = inp.value.trim();
    if (v === '') { allDone = false; return; }
    const ans = Number(row.dataset.answer);
    if (Number(v) === ans) {
      row.dataset.state = 'ok';
      inp.classList.remove('err'); inp.classList.add('ok'); inp.disabled = true;
      mark.textContent = '✅'; mark.className = 'mark show';
      newlyCorrect++;
    } else {
      row.dataset.state = 'err-shown';
      inp.classList.remove('ok'); inp.classList.add('err');
      mark.textContent = '❌'; mark.className = 'mark show';
      newlyWrong++;
      const self = row;
      setTimeout(() => {
        if (self.dataset.state !== 'ok') {
          self.dataset.state = 'ok';
          inp.value = ''; inp.placeholder = String(ans);
          inp.classList.remove('err'); inp.classList.add('ok'); inp.disabled = true;
          mark.textContent = '✅';
        }
      }, 1000);
      allDone = false;
    }
  });

  if (newlyCorrect > 0) {
    for (let i = 0; i < newlyCorrect; i++) setTimeout(() => { addReward(1, 1); coinFloat(); }, i * 80);
    soundCorrect();
    $('threeFeedback').textContent = `+${newlyCorrect} ✅`;
    $('threeFeedback').className = 'feedback ok';
  }
  if (newlyWrong > 0) { petSad(); soundWrong(); }

  if (allDone && newlyCorrect > 0) {
    celebrate('🏆');
    setTimeout(() => buildThreeGroups(), 1400);
  }
}

$('checkBtn').onclick = checkThree;
$('nextBtn').onclick = () => { soundClick(); buildThreeGroups(); };
$('groups').addEventListener('keydown', e => { if (e.key === 'Enter') checkThree(); });

/* ================= ПОЛНЫЙ КУРС ================= */
let game = { type: null, total: 10, index: 0, correct: 0 };
const GAME_NAMES = {
  examples: '✏️ Тренажёр примеров',
  quick: '⚡ Быстрый счёт',
  table: '🔢 Таблица умножения',
  finderr: '🔍 Найди ошибку',
  order: '🧩 Порядок действий',
  compare: '⚖️ Сравни числа',
  round: '🎯 Округли числа',
  word: '📖 Задачи'
};

document.querySelectorAll('.game-card').forEach(btn => {
  btn.onclick = () => { soundClick(); startGame(btn.dataset.game); };
});

function startGame(type) {
  game = { type, total: 10, index: 0, correct: 0 };
  $('gameTitle').textContent = GAME_NAMES[type];
  showScreen('gameScreen');
  nextQuestion();
}
function updateProgress() {
  $('progressFill').style.width = (game.index / game.total * 100) + '%';
}
function nextQuestion() {
  if (game.index >= game.total) return finishGame();
  updateProgress();
  const body = $('gameBody');
  body.innerHTML = '';
  body.style.animation = 'none';
  void body.offsetWidth;
  body.style.animation = 'slideIn .35s ease';
  switch (game.type) {
    case 'examples': return qExamples(body);
    case 'quick':    return qQuick(body);
    case 'table':    return qTable(body);
    case 'finderr':  return qFindErr(body);
    case 'order':    return qOrder(body);
    case 'compare':  return qCompare(body);
    case 'round':    return qRound(body);
    case 'word':     return qWord(body);
  }
}
function answerCorrect(msg = 'Правильно! 🎉') {
  game.correct++;
  addReward(1, 1); coinFloat();
  const fb = $('feedback');
  if (fb) { fb.textContent = msg; fb.className = 'feedback ok'; }
  game.index++;
  setTimeout(nextQuestion, 900);
}
function answerWrong(correctText) {
  petSad(); soundWrong();
  const fb = $('feedback');
  if (fb) { fb.textContent = 'Не так. ' + correctText; fb.className = 'feedback err'; }
  game.index++;
  setTimeout(nextQuestion, 1500);
}
function finishGame() {
  updateProgress();
  const pct = Math.round(game.correct / game.total * 100);
  let medal = '🥉', msg = 'Хорошая работа!';
  if (pct === 100) { medal = '🏆'; msg = 'Идеально! Ты супер!'; }
  else if (pct >= 80) { medal = '🥇'; msg = 'Отлично!'; }
  else if (pct >= 60) { medal = '🥈'; msg = 'Молодец, продолжай!'; }
  $('gameBody').innerHTML = `
    <div class="result-screen">
      <div class="big">${medal}</div>
      <div class="score">${game.correct} из ${game.total} (${pct}%)</div>
      <div class="msg">${msg}</div>
      <div class="buttons">
        <button class="btn-main" id="againBtn">Ещё раз</button>
        <button class="btn-main btn-alt" id="backToCourse">К играм</button>
      </div>
    </div>`;
  $('againBtn').onclick = () => { soundClick(); startGame(game.type); };
  $('backToCourse').onclick = () => { soundClick(); showScreen('courseScreen'); };
  if (pct >= 80) celebrate(medal);
}

/* --- ИГРА: ТРЕНАЖЁР ПРИМЕРОВ (ввод ответа) --- */
function qExamples(body) {
  const ops = ['+','−','×','÷'];
  const op = ops[rnd(0,3)];
  let a, b, ans;
  if (op === '+') { a = rnd(100, 899); b = rnd(50, 200); ans = a + b; }
  else if (op === '−') { a = rnd(300, 990); b = rnd(50, a - 50); ans = a - b; }
  else if (op === '×') { a = rnd(2,10); b = rnd(2,10); if (Math.random()<.5){a=rnd(11,99);b=rnd(2,6);} ans = a*b; }
  else { b = rnd(2,9); ans = rnd(2,10); if (Math.random()<.5){b=rnd(2,6);ans=rnd(11,50);} a = b*ans; }

  body.innerHTML = `
    <div class="task-box">${a} ${op} ${b} = ?</div>
    <div class="input-row">
      <input type="number" id="ansInput" placeholder="?" inputmode="numeric">
      <button class="btn-main" id="submitBtn">OK</button>
    </div>
    <div class="feedback" id="feedback"></div>`;
  const inp = $('ansInput');
  inp.focus();
  const submit = () => {
    const v = inp.value.trim(); if (!v) return;
    if (Number(v) === ans) answerCorrect();
    else answerWrong(`Правильно: ${ans}`);
  };
  $('submitBtn').onclick = submit;
  inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* --- ИГРА: БЫСТРЫЙ СЧЁТ (выбор из 4) --- */
function qQuick(body) {
  let a, b, op, ans;
  const t = rnd(0,2);
  if (t === 0) { a = rnd(10,99); b = rnd(10,99); op='+'; ans=a+b; }
  else if (t === 1) { a = rnd(30,99); b = rnd(10,a-5); op='−'; ans=a-b; }
  else { a = rnd(2,9); b = rnd(2,9); op='×'; ans=a*b; }
  const opts = new Set([ans]);
  while (opts.size < 4) { const f = ans + rnd(-10,10); if (f !== ans && f > 0) opts.add(f); }
  const list = shuffle([...opts]);
  body.innerHTML = `
    <div class="task-box">${a} ${op} ${b} = ?</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>`;
  const box = $('options');
  list.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn'; btn.textContent = v;
    btn.onclick = () => {
      if (v === ans) { btn.classList.add('correct'); answerCorrect(); }
      else { btn.classList.add('wrong'); answerWrong(`Правильно: ${ans}`); }
      box.querySelectorAll('button').forEach(x => x.disabled = true);
    };
    box.appendChild(btn);
  });
}

/* --- ИГРА: ТАБЛИЦА УМНОЖЕНИЯ --- */
function qTable(body) {
  const a = rnd(2,9), b = rnd(2,9), ans = a * b;
  const opts = new Set([ans]);
  while (opts.size < 4) opts.add(rnd(2, 81));
  const list = shuffle([...opts]);
  body.innerHTML = `
    <div class="task-box">${a} × ${b} = ?</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>`;
  const box = $('options');
  list.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn'; btn.textContent = v;
    btn.onclick = () => {
      if (v === ans) { btn.classList.add('correct'); answerCorrect(); }
      else { btn.classList.add('wrong'); answerWrong(`Правильно: ${ans}`); }
      box.querySelectorAll('button').forEach(x => x.disabled = true);
    };
    box.appendChild(btn);
  });
}

/* --- ИГРА: НАЙДИ ОШИБКУ --- */
function qFindErr(body) {
  const ops = ['+','−','×'];
  const op = ops[rnd(0,2)];
  let a, b, realAns;
  if (op === '+') { a = rnd(10,99); b = rnd(10,99); realAns = a+b; }
  else if (op === '−') { a = rnd(30,99); b = rnd(10,a-5); realAns = a-b; }
  else { a = rnd(2,9); b = rnd(2,9); realAns = a*b; }
  const hasError = Math.random() < .5;
  let shown = realAns;
  if (hasError) { do { shown = realAns + rnd(1,10) * (Math.random()<.5?1:-1); } while (shown === realAns || shown < 0); }

  body.innerHTML = `
    <div class="task-box">${a} ${op} ${b} = ${shown}</div>
    <div class="find-err-row">
      <button class="btn-yes" id="yesBtn">✅ Верно</button>
      <button class="btn-no" id="noBtn">❌ Ошибка</button>
    </div>
    <div class="feedback" id="feedback"></div>`;
  $('yesBtn').onclick = () => {
    if (!hasError) answerCorrect('Да, всё верно! ✅');
    else answerWrong(`Здесь ошибка. Правильно: ${realAns}`);
  };
  $('noBtn').onclick = () => {
    if (hasError) answerCorrect('Точно, тут ошибка! 🔍');
    else answerWrong(`Ошибки нет. ${realAns} — верный ответ`);
  };
}

/* --- ИГРА: ПОРЯДОК ДЕЙСТВИЙ --- */
function qOrder(body) {
  let a = rnd(2,9), b = rnd(2,9), c = rnd(2,20);
  let ans, text;
  const type = rnd(0,2);
  if (type === 0) { ans = a * b + c; text = `${a} × ${b} + ${c} = ?`; }
  else if (type === 1) { ans = c + a * b; text = `${c} + ${a} × ${b} = ?`; }
  else { let m = a * b; let k = rnd(1, m-1); ans = m - k; text = `${a} × ${b} − ${k} = ?`; }

  body.innerHTML = `
    <div class="task-box">${text}</div>
    <div class="input-row">
      <input type="number" id="ansInput" placeholder="?" inputmode="numeric">
      <button class="btn-main" id="submitBtn">OK</button>
    </div>
    <div class="feedback" id="feedback"></div>`;
  const inp = $('ansInput');
  inp.focus();
  const submit = () => {
    const v = inp.value.trim(); if (!v) return;
    if (Number(v) === ans) answerCorrect();
    else answerWrong(`Правильно: ${ans}`);
  };
  $('submitBtn').onclick = submit;
  inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* --- ИГРА: СРАВНИ ЧИСЛА --- */
function qCompare(body) {
  let a = rnd(100, 9999), b = rnd(100, 9999);
  if (Math.random() < .3) b = a;
  const correct = a > b ? '>' : (a < b ? '<' : '=');
  body.innerHTML = `
    <div class="task-box">${a} ? ${b}</div>
    <div class="options" style="grid-template-columns:repeat(3,1fr)" id="options"></div>
    <div class="feedback" id="feedback"></div>`;
  const box = $('options');
  ['>','<','='].forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn'; btn.textContent = s;
    btn.onclick = () => {
      if (s === correct) { btn.classList.add('correct'); answerCorrect(); }
      else { btn.classList.add('wrong'); answerWrong(`Правильно: ${a} ${correct} ${b}`); }
      box.querySelectorAll('button').forEach(x => x.disabled = true);
    };
    box.appendChild(btn);
  });
}

/* --- ИГРА: ОКРУГЛИ ЧИСЛА --- */
function qRound(body) {
  const places = [10, 100, 1000];
  const place = places[rnd(0,2)];
  const a = rnd(20, 9999);
  const ans = Math.round(a / place) * place;
  body.innerHTML = `
    <div class="task-box">${a} ≈ ?<br><span style="font-size:15px;color:#888">до ${place}</span></div>
    <div class="input-row">
      <input type="number" id="ansInput" placeholder="?" inputmode="numeric">
      <button class="btn-main" id="submitBtn">OK</button>
    </div>
    <div class="feedback" id="feedback"></div>`;
  const inp = $('ansInput');
  inp.focus();
  const submit = () => {
    const v = inp.value.trim(); if (!v) return;
    if (Number(v) === ans) answerCorrect();
    else answerWrong(`Правильно: ${ans}`);
  };
  $('submitBtn').onclick = submit;
  inp.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* ================= МАГАЗИН ================= */
const SHOP_ITEMS = [
  { id: 'star5', name: '⭐ +5 звёзд', price: 10 },
  { id: 'reset', name: '🔄 Сброс прогресса', price: 0 },
  { id: 'hint', name: '💡 Подсказка (откр.)', price: 20 }
];
function renderShop() {
  const body = $('shopBody');
  body.innerHTML = '';
  SHOP_ITEMS.forEach(it => {
    const div = document.createElement('div');
    div.className = 'shop-item';
    const bought = state.purchased.includes(it.id);
    div.innerHTML = `<div><span class="name">${it.name}</span> <span class="price">🪙 ${it.price}</span></div>`;
    const btn = document.createElement('button');
    btn.textContent = bought ? 'Куплено' : 'Купить';
    btn.disabled = bought || state.coins < it.price;
    btn.onclick = () => {
      if (state.coins < it.price) return;
      state.coins -= it.price;
      if (it.id === 'star5') { state.stars += 5; state.purchased.push(it.id); }
      if (it.id === 'hint') { state.purchased.push(it.id); }
      if (it.id === 'reset') {
        if (!confirm('Сбросить весь прогресс?')) return;
        state = { ...defaultState };
      }
      saveState(); updateHUD(); renderShop(); soundCorrect();
    };
    div.appendChild(btn);
    body.appendChild(div);
  });
  body.insertAdjacentHTML('beforeend', `<div class="hint-text">Монетки и звёзды сохраняются в браузере</div>`);
}

$('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
$('soundBtn').classList.toggle('active', state.soundOn);
updateHUD();
buildThreeGroups();
</script>
